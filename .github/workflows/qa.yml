name: QA Portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/proshop_qa_portfolio
      JWT_SECRET: ci-only-not-for-production
      PAGINATION_LIMIT: 4
      QA_BASE_URL: http://127.0.0.1:5000
      QA_CHROME_PATH: bundled

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proshop/package-lock.json
            proshop/frontend/package-lock.json

      - name: Install QA tooling
        run: npm ci --include=dev

      - name: Install application dependencies
        working-directory: proshop
        run: npm install --include=dev

      - name: Install frontend dependencies
        working-directory: proshop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: proshop/frontend
        run: npm run build

      - name: Seed QA database
        working-directory: proshop
        run: npm run data:import

      - name: Start application
        working-directory: proshop
        run: nohup npm start > ../reports/ci-server.log 2>&1 &

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/api/products && exit 0
            sleep 2
          done
          exit 1

      - name: Install CI Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Core browser workflow
        run: npm run test:browser

      - name: Accessibility scan
        continue-on-error: true
        run: npm run test:accessibility

      - name: Performance smoke
        run: npm run test:performance

      - name: API regression with known-defect evidence
        continue-on-error: true
        run: npx --yes newman run postman/ProShop-QA.postman_collection.json -e postman/Local-QA.postman_environment.json --reporters cli,json --reporter-json-export reports/newman-results.json

      - name: Generate HTML dashboard
        if: always()
        run: npm run report:html

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            reports/
            evidence/
          retention-days: 14
