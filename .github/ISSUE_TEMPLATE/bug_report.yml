name: QA defect
description: Report a reproducible application defect
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: module
    attributes:
      label: Module
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and build
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1.\n2.\n3."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized screenshots, video, logs, or requests and responses.
    validations:
      required: true
